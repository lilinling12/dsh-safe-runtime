name: R1-004 source-backed build evidence

on:
  push:
    branches:
      - evidence/r1-004-lockgen

permissions:
  contents: read

jobs:
  source-backed-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4

      - name: Checkout exact DeepSeek Harness source baseline
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .tmp/deepseek-harness
          fetch-depth: 1

      - name: Set up Node 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(pnpm --version)" = "11.7.0"

      - name: Build pinned Harness public type surface
        working-directory: .tmp/deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib:host

      - name: Install safe-runtime dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Project exact pinned Harness workspace packages
        run: |
          node packages/adapter-dsh/scripts/project-pinned-harness-workspace.mjs \
            --source-root .tmp/deepseek-harness \
            --consumer-root . \
            --consumer-root .tmp/deepseek-harness \
            --manifest .tmp/harness-workspace-projection.json

      - name: Emit publication source graph against exact pinned source
        run: |
          cat > packages/adapter-dsh/tsconfig.publish-probe.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "composite": false,
              "rootDir": "src",
              "outDir": ".tmp/r1-004-dist",
              "noEmit": false,
              "declaration": true,
              "declarationMap": false,
              "sourceMap": false
            },
            "include": ["src/**/*.ts"],
            "exclude": []
          }
          JSON

          rm -rf packages/adapter-dsh/.tmp/r1-004-dist
          pnpm --filter @dsh-safe/adapter-dsh exec tsc -p tsconfig.publish-probe.json
          test -f packages/adapter-dsh/.tmp/r1-004-dist/index.js
          test -f packages/adapter-dsh/.tmp/r1-004-dist/index.d.ts
          find packages/adapter-dsh/.tmp/r1-004-dist -type f -print | sort

      - name: Upload source-backed build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-004-source-backed-build-evidence
          if-no-files-found: error
          path: |
            .tmp/harness-workspace-projection.json
            packages/adapter-dsh/tsconfig.publish-probe.json
            packages/adapter-dsh/.tmp/r1-004-dist
