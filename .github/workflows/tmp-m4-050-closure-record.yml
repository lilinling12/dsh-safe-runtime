name: Temporary M4-050 closure record

on:
  push:
    branches:
      - tmp/m4-050-governance-candidate

permissions:
  contents: write

jobs:
  build-closure-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified closure record
        shell: bash
        run: |
          set -euo pipefail

          expected_history_blob='2c1016fb425a6aac7f3242299544f4d6d64e4e94'
          actual_history_blob="$(git hash-object docs/handoff/HISTORY.md)"
          test "$actual_history_blob" = "$expected_history_blob"

          cp docs/handoff/HISTORY.md /tmp/HISTORY.before

          cat >> docs/handoff/HISTORY.md <<'EOF'

          ## 2026-09-08 — Close M4-050 governance and authorize M4-051 protocol-first

          M4-050 governance transition head
          `7c93e12380ce0595192f423ec98e9f9b97b9385d` passed normal CI #633 / run
          `34206675133` and exact Harness rc5 source-conformance #575 / run
          `34206675087`. Harness job `101997661205` passed step 10 pinned-source
          TypeScript and step 11 real rc5 runtime on that same exact SHA.

          The exact diff from verified handoff parent
          `8365a1c131a971a00334640364c0bc3bff9aaf89` is restricted to the authorized
          governance files: CURRENT `+5/-3`, HISTORY `+49/-0`, and only the M4-050
          roadmap marker/details `+1/-1`. HISTORY preserves its complete prior byte
          prefix; no production, Spec/corpus/schema, Shared TCK, dependency, lockfile,
          Adapter/Harness baseline/workflow or later-Gate behavior changed in the
          governance transition.

          M4-050 is GOVERNANCE CLOSED. M4-051 P0 equivalent shell spelling bypass string
          matcher test is the sole newly authorized protocol-first Gate. M4-052+, M5,
          M6, M10, M13, M14 implementation and M15 remain unauthorized by this closure.
          PR #3 remains Open / Draft; merge remains unauthorized without explicit user
          approval.

          This closure-record head must itself reach exact-head normal CI plus exact
          pinned Harness rc5 source-conformance, including step 10 and step 11, before
          any M4-051 repository modification begins.
          EOF

          python3 - <<'PY'
          from pathlib import Path

          before = Path('/tmp/HISTORY.before').read_bytes()
          after = Path('docs/handoff/HISTORY.md').read_bytes()
          if not after.startswith(before):
              raise SystemExit('HISTORY prefix changed')

          current = Path('docs/handoff/CURRENT.md')
          text = current.read_text()
          replacements = {
              '- Accepted predecessor governance head: `4124fbfbcc8186b972f4f61646a42b012ce1977f`':
              '- M4-050 governance transition head: `7c93e12380ce0595192f423ec98e9f9b97b9385d` — dual-green',
              '- M4-050 direct Node fs bypass → `EXPECTED_UNGOVERNED`: **IMPLEMENTATION / CONFORMANCE ACCEPTED; GOVERNANCE TRANSITION PENDING EXACT-HEAD DUAL-GREEN**':
              '- M4-050 direct Node fs bypass → `EXPECTED_UNGOVERNED`: **GOVERNANCE CLOSED**',
              '- M4-051+: **NOT AUTHORIZED until the M4-050 governance exact head is dual-green and closure is recorded**':
              '- M4-051 equivalent shell spelling bypass string matcher test: **AUTHORIZED / PROTOCOL-FIRST NOT YET STARTED**\n- M4-052+: **NOT AUTHORIZED by the M4-050 closure**'
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'CURRENT replacement count != 1: {old!r}')
              text = text.replace(old, new)

          marker = '## Current governance boundary\n'
          if text.count(marker) != 1:
              raise SystemExit('CURRENT governance boundary count != 1')
          prefix, _, _ = text.partition(marker)
          text = prefix + marker + '''\nM4-050 governance transition exact head:\n\n```text\n7c93e12380ce0595192f423ec98e9f9b97b9385d\n```\n\n- CI #633 / run `34206675133`: PASS.\n- Harness #575 / run `34206675087`: PASS.\n- Harness job `101997661205`, step 10 exact pinned-source typecheck: PASS.\n- Same job, step 11 real rc5 runtime conformance: PASS.\n- Exact transition diff: CURRENT `+5/-3`, HISTORY `+49/-0`, roadmap `+1/-1`; no other files changed.\n\nM4-050 is **GOVERNANCE CLOSED**. M4-051 is the sole newly authorized engineering Gate and must begin protocol-first. M4-052+ and all later milestones remain unauthorized by this closure.\n\nThis closure record itself must reach exact-head normal CI plus exact pinned Harness rc5 source-conformance dual-green before any M4-051 repository modification begins. PR #3 must remain Open / Draft and must not be merged without explicit user authorization.\n'''
          current.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path
          before = Path('/tmp/HISTORY.before').read_bytes()
          after = Path('docs/handoff/HISTORY.md').read_bytes()
          assert after[:len(before)] == before
          assert after != before
          PY

          rm .github/workflows/tmp-m4-050-closure-record.yml

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-m4-050-closure-record.yml docs/handoff/CURRENT.md docs/handoff/HISTORY.md | sort)"
          test "$changed" = "$expected"

          history_numstat="$(git diff --numstat -- docs/handoff/HISTORY.md)"
          history_add="$(printf '%s' "$history_numstat" | awk '{print $1}')"
          history_del="$(printf '%s' "$history_numstat" | awk '{print $2}')"
          test "$history_add" -gt 0
          test "$history_del" = '0'

          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/CURRENT.md docs/handoff/HISTORY.md .github/workflows/tmp-m4-050-closure-record.yml
          git commit -m 'docs(governance): build verified M4-050 closure record'
          git push origin HEAD:tmp/m4-050-governance-candidate
