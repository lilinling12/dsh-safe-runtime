name: M4-008 protocol corpus correction

on:
  push:
    branches:
      - automation/m4-008-protocol-corpus-fix

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/m4-008-protocol-corpus-fix
          fetch-depth: 1

      - name: Restore candidate fixture and apply exact corrections
        shell: bash
        run: |
          set -euo pipefail
          git show ee8ff0355e330f9805c4250c527101a432384f7b:fixtures/policy-diagnostics/cases.json > fixtures/policy-diagnostics/cases.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('fixtures/policy-diagnostics/cases.json')
          text = path.read_text(encoding='utf-8')

          old_lease = '"lease": { "ttlSeconds": 60, "maxUses": 1 }'
          new_lease = '"lease": { "ttlMs": 60000, "maxUses": 1 }'
          if text.count(old_lease) != 1:
              raise SystemExit(f'expected one old lease spelling, found {text.count(old_lease)}')
          text = text.replace(old_lease, new_lease, 1)

          marker = '    {\n      "id": "invalid-embedded-globstar",'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one insertion marker, found {text.count(marker)}')
          if '"id": "control-code-in-locator-pattern"' in text:
              raise SystemExit('control-code fixture already exists')

          case = r'''    {
      "id": "control-code-in-locator-pattern",
      "policy": {
        "apiVersion": "safe-runtime.dev/v1alpha1",
        "kind": "CapabilityPolicy",
        "metadata": { "name": "control-pattern" },
        "spec": {
          "defaultEffect": "deny",
          "rules": [
            { "id": "r", "effect": "allow", "capabilities": ["fs.read"], "resources": ["workspace://src/line\nbreak"] }
          ]
        }
      },
      "expect": {
        "status": "DIAGNOSED",
        "diagnostics": [
          { "severity": "ERROR", "code": "RESOURCE_LOCATOR_INVALID", "instancePath": "/spec/rules/0/resources/0" }
        ],
        "truncated": false
      }
    },
'''
          text = text.replace(marker, case + marker, 1)
          path.write_text(text, encoding='utf-8')

          doc = json.loads(text)
          cases = doc['cases']
          if len(cases) != 21 or len({case['id'] for case in cases}) != 21:
              raise SystemExit('expected 21 unique cases')
          control = next(case for case in cases if case['id'] == 'control-code-in-locator-pattern')
          if control['policy']['spec']['rules'][0]['resources'][0] != 'workspace://src/line\nbreak':
              raise SystemExit('control-code case decode mismatch')
          future = next(case for case in cases if case['id'] == 'future-fields-ignored')
          if future['policy']['spec']['rules'][0]['lease'] != {'ttlMs': 60000, 'maxUses': 1}:
              raise SystemExit('lease correction mismatch')
          PY

      - name: Verify minimal product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only ee8ff0355e330f9805c4250c527101a432384f7b -- fixtures/policy-diagnostics/cases.json | grep -Fx 'fixtures/policy-diagnostics/cases.json'
          read -r added removed _ < <(git diff --numstat ee8ff0355e330f9805c4250c527101a432384f7b -- fixtures/policy-diagnostics/cases.json)
          if [[ "$added" -gt 30 || "$removed" -gt 2 ]]; then
            echo "excessive fixture churn: +$added -$removed" >&2
            git diff ee8ff0355e330f9805c4250c527101a432384f7b -- fixtures/policy-diagnostics/cases.json >&2
            exit 1
          fi
          git diff ee8ff0355e330f9805c4250c527101a432384f7b -- fixtures/policy-diagnostics/cases.json

      - name: Commit corrected fixture blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/policy-diagnostics/cases.json
          git commit -m "test(policy): correct M4-008 portable diagnostics corpus"
          git push origin HEAD:automation/m4-008-protocol-corpus-fix
