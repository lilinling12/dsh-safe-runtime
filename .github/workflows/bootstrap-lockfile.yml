name: Bootstrap pnpm lockfile

on:
  push:
    branches: [feat/m2-harness-adapter]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2-harness-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version
      - name: Resolve dependency graph without mutating package manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit reviewed dependency resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches package manifests."
            exit 0
          fi
          git commit -m "chore: add reproducible pnpm lockfile"
          git push origin HEAD:feat/m2-harness-adapter
