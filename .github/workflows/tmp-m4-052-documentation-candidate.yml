name: tmp-m4-052-documentation-candidate

on:
  push:
    branches:
      - tmp/m4-052-documentation-candidate

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: tmp/m4-052-documentation-candidate
          fetch-depth: 0

      - name: Build and self-verify documentation candidate
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="5f1849271796bf688148eb507d963831e0141fbf"
          WORKFLOW_PATH=".github/workflows/tmp-m4-052-documentation-candidate.yml"

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          anchor = "## Maturity pipeline\n"
          if readme.count(anchor) != 1:
              raise SystemExit("README maturity anchor count is not exactly one")
          insertion = """## v0.1 plugin security boundary\n\n**DSH Safe Runtime v0.1 is not a sandbox for arbitrary in-process plugins.**\n\nThe Capability Broker can enforce actions that reach the supported ToolRuntime /\nprovider enforcement seams. Code running in the same host process can still use\nhost APIs outside those seams when ordinary OS permissions allow it; the accepted\nM4-050 direct-host filesystem witness documents one such boundary. Therefore\n`tool-enforced` MUST NOT be presented as `process-isolated`.\n\nM4-051 separately shows that shell command text is not a complete authority for\nnested effects; recognized shell calls still remain `process.exec`. A future\nprocess-isolated Plugin Host is tracked as M14 and is not part of v0.1.\n\n"""
          readme_path.write_text(readme.replace(anchor, insertion + anchor), encoding="utf-8")

          architecture_path = Path("docs/architecture.md")
          architecture = architecture_path.read_text(encoding="utf-8")
          anchor = "## 7.3 PEP-FS\n"
          if architecture.count(anchor) != 1:
              raise SystemExit("architecture PEP-FS anchor count is not exactly one")
          insertion = """### 7.2.1 v0.1 Plugin Sandbox Non-Claim\n\nDSH Safe Runtime v0.1 **不是 arbitrary in-process Plugin 的 sandbox**。\n\n当前边界必须按以下两个执行域区分：\n\n```text\n进入 Harness ToolRuntime / accepted provider seam 的 action\n  -> Capability Broker / policy / guard / approval\n  -> 只能按已接受证据宣称 tool-enforced / provider-aware guarantee\n\n同进程 Plugin 直接使用宿主 Node / runtime / native API\n  -> 可能完全不进入上述 seam\n  -> 不能宣称 process-isolated / sandboxed\n```\n\nM4-050 已用真实的 test-owned direct `node:fs` mutation 证明第二类边界可以\n存在，并要求诚实记录为 `EXPECTED_UNGOVERNED`，而不是伪造 ALLOW/DENY。\nM4-051 则是另一个更窄的负面边界：Shell String 不能作为 nested effect 的\n唯一安全语义；它不取消 recognized shell call 的 `process.exec` classification。\n\n因此以下推论均不成立：\n\n```text\ntool policy => arbitrary Plugin isolation\ntool-enforced => process-isolated\ncommand string matcher => complete nested-effect mediation\nworkspace rollback => complete Plugin sandbox\ndocumentation statement => runtime enforcement\n```\n\n真正的 process-isolated Plugin Host 明确属于未来 M14，包括 isolated worker、\nno host env/cwd inheritance、brokered fs/process/network RPC、resource limits 与\ncrash isolation。在 M14 相关 Gate 被独立实现并验收前，任何 v0.1 文档、\nGuaranteeLevel 或产品描述都不得提前宣称这些能力。\n\n"""
          architecture_path.write_text(
              architecture.replace(anchor, insertion + anchor),
              encoding="utf-8",
          )
          PY

          cat > packages/adapter-dsh/source-conformance/m4-052-plugin-sandbox-documentation-boundary.conformance.ts <<'EOF'
          import { readFile } from "node:fs/promises";

          import corpusJson from "../../../fixtures/plugin-sandbox-documentation-boundary/cases.json" with { type: "json" };
          import { describe, expect, it } from "vitest";

          const PROFILE = "M4-052_PLUGIN_SANDBOX_DOCUMENTATION_BOUNDARY_V1" as const;
          const CASE_COUNT = 24;

          interface CorpusCase {
            readonly id: string;
            readonly requirement: string;
            readonly evidence: string;
          }

          interface Corpus {
            readonly profile: string;
            readonly pinnedHarness: {
              readonly version: string;
              readonly commit: string;
            };
            readonly cases: readonly CorpusCase[];
          }

          const CORPUS = corpusJson as Corpus;
          const ROOT = new URL("../../../", import.meta.url);

          function expectedIds(): readonly string[] {
            return Array.from(
              { length: CASE_COUNT },
              (_unused, index) => `PSDB-${String(index + 1).padStart(3, "0")}`,
            );
          }

          describe("M4-052 plugin-sandbox documentation boundary", () => {
            it("pins the exact corpus profile and Harness compatibility baseline", () => {
              expect(CORPUS.profile).toBe(PROFILE);
              expect(CORPUS.pinnedHarness).toEqual({
                version: "0.1.0-rc.5",
                commit: "47f943859bef60e4160492346772ded9b24f765a",
              });
            });

            it("contains exactly PSDB-001 through PSDB-024 once", () => {
              const ids = CORPUS.cases.map(({ id }) => id);
              expect(ids).toEqual(expectedIds());
              expect(new Set(ids).size).toBe(CASE_COUNT);
              expect(CORPUS.cases.every(({ requirement, evidence }) =>
                requirement.length > 0 && evidence.length > 0)).toBe(true);
            });

            it("makes the v0.1 non-sandbox boundary discoverable from README", async () => {
              const readme = await readFile(new URL("README.md", ROOT), "utf8");

              expect(readme).toContain(
                "DSH Safe Runtime v0.1 is not a sandbox for arbitrary in-process plugins.",
              );
              expect(readme).toContain("`tool-enforced` MUST NOT be presented as `process-isolated`");
              expect(readme).toContain("future process-isolated Plugin Host is tracked as M14");
              expect(readme).toContain(
                "Tool-level policy MUST NOT be described as isolation of arbitrary in-process plugins.",
              );
            });

            it("keeps the technical non-claim explicit in architecture", async () => {
              const architecture = await readFile(
                new URL("docs/architecture.md", ROOT),
                "utf8",
              );

              expect(architecture).toContain("### 7.2.1 v0.1 Plugin Sandbox Non-Claim");
              expect(architecture).toContain("不是 arbitrary in-process Plugin 的 sandbox");
              expect(architecture).toContain("tool-enforced => process-isolated");
              expect(architecture).toContain("M4-050");
              expect(architecture).toContain("M4-051");
              expect(architecture).toContain("真正的 process-isolated Plugin Host 明确属于未来 M14");
            });

            it("preserves the existing PEP-TOOL and future-M14 authority boundaries", async () => {
              const architecture = await readFile(
                new URL("docs/architecture.md", ROOT),
                "utf8",
              );
              const roadmap = await readFile(new URL("docs/roadmap.md", ROOT), "utf8");

              expect(architecture).toContain("只治理进入 Tool Pipeline 的行为");
              expect(architecture).toContain("宿主 Plugin 直接调用 Node API 不受此边界约束");
              expect(architecture).toContain("不能宣称 `process-isolated`");
              expect(roadmap).toContain("# M14 — Process-isolated Plugin Host");
              expect(roadmap).toContain("长期安全里程碑，不要提前宣称完成");
            });
          });
          EOF

          git diff --check

          printf '%s\n' \
            README.md \
            docs/architecture.md \
            packages/adapter-dsh/source-conformance/m4-052-plugin-sandbox-documentation-boundary.conformance.ts \
            | sort > /tmp/expected-before-rm
          git status --short
          git diff --name-only | sort > /tmp/actual-before-rm
          # Untracked source-conformance is added explicitly for the name-set check.
          printf '%s\n' packages/adapter-dsh/source-conformance/m4-052-plugin-sandbox-documentation-boundary.conformance.ts \
            >> /tmp/actual-before-rm
          sort -u /tmp/actual-before-rm -o /tmp/actual-before-rm
          diff -u /tmp/expected-before-rm /tmp/actual-before-rm

          git add README.md docs/architecture.md \
            packages/adapter-dsh/source-conformance/m4-052-plugin-sandbox-documentation-boundary.conformance.ts
          git rm "$WORKFLOW_PATH"

          printf '%s\n' \
            "$WORKFLOW_PATH" \
            README.md \
            docs/architecture.md \
            packages/adapter-dsh/source-conformance/m4-052-plugin-sandbox-documentation-boundary.conformance.ts \
            | sort > /tmp/expected-final
          git diff HEAD --name-only | sort > /tmp/actual-final
          diff -u /tmp/expected-final /tmp/actual-final

          git config user.name "lilinling12"
          git config user.email "66773695+lilinling12@users.noreply.github.com"
          git commit -m "docs(m4-052): stage verified plugin sandbox boundary"
          git push origin HEAD:refs/heads/tmp/m4-052-documentation-candidate
