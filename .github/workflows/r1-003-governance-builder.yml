name: R1-003 Governance Builder

on:
  push:
    branches:
      - tmp/r1-003-governance-builder-20260911

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Preserve builder script
        run: cp .github/scripts/r1_003_governance_builder.py /tmp/r1_003_governance_builder.py

      - name: Checkout exact accepted audit parent
        uses: actions/checkout@v4
        with:
          ref: fea37f8574585813f6c6c264a9d2c548286a6a41
          fetch-depth: 1

      - name: Build governance commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 /tmp/r1_003_governance_builder.py
