name: Generate M4 YAML lockfile

on:
  push:
    branches:
      - automation/m4-yaml-lockfile

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout safe runtime
        uses: actions/checkout@v4

      - name: Use repository Node baseline
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Generate lockfile from manifests
        run: pnpm install --lockfile-only

      - name: Verify frozen install from generated lockfile
        run: pnpm install --frozen-lockfile

      - name: Show scoped lockfile diff
        run: git diff -- packages/policy-engine/package.json pnpm-lock.yaml

      - name: Persist generated lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "build(policy): generate yaml lockfile"
          git push origin HEAD:automation/m4-yaml-lockfile
