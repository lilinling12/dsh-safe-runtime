name: tmp-m4-051-closure-candidate

on:
  push:
    branches:
      - tmp/m4-051-governance-candidate

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: tmp/m4-051-governance-candidate
          fetch-depth: 0

      - name: Build and self-verify closure candidate
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="33d33c71f754f9ac6042a72169382e9b15f21b0f"
          HISTORY_SHA="32afaff09050f23f7946eebd78a522d1039f0027"
          WORKFLOW_PATH=".github/workflows/tmp-m4-051-closure-candidate.yml"

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git hash-object docs/handoff/HISTORY.md)" = "$HISTORY_SHA"

          cp docs/handoff/HISTORY.md /tmp/HISTORY.before

          cat >> docs/handoff/HISTORY.md <<'EOF'

          ## 2026-09-08 — Close M4-051 governance and authorize M4-052 protocol-first

          M4-051 governance transition head
          `33d33c71f754f9ac6042a72169382e9b15f21b0f` passed normal CI #638 / run
          `34212084370` and exact Harness rc5 source-conformance #580 / run
          `34212084357`. Harness job `102015196009` passed step 10 pinned-source
          TypeScript and step 11 real rc5 runtime conformance on that same exact SHA.

          The exact governance delta from audit head
          `91b9dcef1c092ab0968ff198d6342a8cc9c7bb81` is restricted to CURRENT
          `+77/-43`, HISTORY `+50/-0`, and only the M4-051 roadmap marker/details
          `+1/-1`. The prior HISTORY byte prefix is preserved; no production code,
          Spec/corpus/schema, Shared TCK, dependency, lockfile, Adapter/Harness
          baseline/workflow or later-Gate implementation changed.

          M4-051 is GOVERNANCE CLOSED. M4-052 P0 documentation that v0.1 is not a
          plugin sandbox becomes the sole newly authorized protocol-first Gate.
          M5, M6, M10, M13, M14 implementation and M15 remain unauthorized by this
          closure. PR #3 remains Open / Draft and merge remains unauthorized without
          explicit user approval.

          This closure-record head must itself reach exact-head normal CI plus exact
          pinned Harness rc5 source-conformance, including step 10 and step 11,
          before any M4-052 repository modification begins.
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path("docs/handoff/CURRENT.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "- M4-040..050: **GOVERNANCE CLOSED**\n- M4-051 equivalent shell spelling bypass string matcher test: **PROTOCOL-FIRST CANDIDATE; EXECUTABLE WORK NOT AUTHORIZED UNTIL THIS EXACT HEAD IS DUAL-GREEN**\n- M4-052+: **NOT AUTHORIZED by the current Gate**",
              "- M4-040..051: **GOVERNANCE CLOSED**\n- M4-052 P0 document that v0.1 is not plugin sandbox: **AUTHORIZED / PROTOCOL-FIRST NOT YET IMPLEMENTED**\n- M4-053+: **NOT AUTHORIZED by the current Gate**",
          )

          marker = "## Current governance boundary\n"
          if text.count(marker) != 1:
              raise SystemExit("CURRENT governance marker count is not exactly one")

          prefix = text[: text.index(marker)]
          tail = """## M4-051 governance closure\n\nGovernance transition head:\n\n```text\n33d33c71f754f9ac6042a72169382e9b15f21b0f\n```\n\nExact transition evidence:\n\n- CI #638 / run `34212084370`: PASS;\n- Harness #580 / run `34212084357`: PASS;\n- Harness job `102015196009`, step 10 exact pinned-source typecheck: PASS;\n- same job, step 11 real rc5 runtime conformance: PASS;\n- exact diff from `91b9dcef...`: CURRENT `+77/-43`, HISTORY `+50/-0`,\n  roadmap `+1/-1`; no other files changed.\n\nM4-051 is therefore **GOVERNANCE CLOSED**. Its accepted negative boundary remains\nnarrow: raw shell command spelling cannot be the sole authority for inferred\nnested effects; recognized shell calls remain M4-011 `process.exec`, and no\nproduction matcher/parser, sandbox or isolation guarantee was introduced.\n\n## Current Gate — M4-052 protocol-first authorization\n\nRoadmap Gate:\n\n```text\nM4-052 P0 — document that v0.1 is not plugin sandbox\n```\n\nM4-052 is now the sole newly authorized protocol-first Gate. Before any repository\nmodification, recover the existing architecture/security/product-boundary\nauthority for in-process plugins, direct host APIs, ToolRuntime mediation,\nprovider/process isolation and M14 process-isolated plugin hosting. Do not invent\nnew sandbox semantics from the roadmap wording.\n\nThis closure-record commit is restricted to exactly:\n\n```text\ndocs/handoff/CURRENT.md\ndocs/handoff/HISTORY.md    # append-only; prior byte prefix unchanged\n```\n\nThis closure-record head must itself pass normal CI plus exact pinned Harness rc5\nsource-conformance, including steps 10 and 11, before any M4-052 repository\nmodification begins.\n\nUntil that exact-head dual-green boundary is reached:\n\n```text\nM4-052 repository work: NOT YET AUTHORIZED TO START\nM4-053+: NOT AUTHORIZED\nM5/M6/M10/M13/M14 implementation/M15: NOT AUTHORIZED\nPR #3 merge: NOT AUTHORIZED without explicit user authorization\n```\n"""
          path.write_text(prefix + tail, encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path
          before = Path("/tmp/HISTORY.before").read_bytes()
          after = Path("docs/handoff/HISTORY.md").read_bytes()
          if not after.startswith(before):
              raise SystemExit("HISTORY prior byte prefix changed")
          if len(after) <= len(before):
              raise SystemExit("HISTORY was not appended")
          PY

          git diff --check

          read -r history_add history_del _ < <(git diff --numstat -- docs/handoff/HISTORY.md)
          test "$history_del" = "0"
          test "$history_add" -gt "0"

          printf '%s\n' docs/handoff/CURRENT.md docs/handoff/HISTORY.md | sort > /tmp/expected-before-rm
          git diff --name-only | sort > /tmp/actual-before-rm
          diff -u /tmp/expected-before-rm /tmp/actual-before-rm

          git rm "$WORKFLOW_PATH"

          printf '%s\n' "$WORKFLOW_PATH" docs/handoff/CURRENT.md docs/handoff/HISTORY.md | sort > /tmp/expected-final
          git diff HEAD --name-only | sort > /tmp/actual-final
          diff -u /tmp/expected-final /tmp/actual-final

          git config user.name "lilinling12"
          git config user.email "66773695+lilinling12@users.noreply.github.com"
          git add docs/handoff/CURRENT.md docs/handoff/HISTORY.md
          git commit -m "docs(governance): stage verified M4-051 closure candidate"
          git push origin HEAD:refs/heads/tmp/m4-051-governance-candidate
