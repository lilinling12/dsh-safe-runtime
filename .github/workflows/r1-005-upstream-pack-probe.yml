name: R1-005 Upstream Pack Probe

on:
  push:
    branches:
      - evidence/r1-005-upstream-pack-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Checkout exact pinned Harness source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deepseek-harness"
          git init "$root"
          git -C "$root" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$root" fetch --depth=1 origin 47f943859bef60e4160492346772ded9b24f765a
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "47f943859bef60e4160492346772ded9b24f765a"

      - name: Frozen install and host library build
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deepseek-harness"
          pnpm --dir "$root" install --frozen-lockfile
          pnpm --dir "$root" run build:lib:host

      - name: Pack exact dsh and vendor release families
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deepseek-harness"
          dsh="$RUNNER_TEMP/dsh-pack"
          vendor="$RUNNER_TEMP/vendor-pack"
          cd "$root"
          pnpm exec tsx scripts/release/pack.ts --family dsh --out "$dsh"
          pnpm exec tsx scripts/release/pack.ts --family vendor --out "$vendor"
          test -n "$(find "$dsh" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$(find "$vendor" -maxdepth 1 -name '*.tgz' -print -quit)"
          echo "DSH_TARBALL_COUNT=$(find "$dsh" -maxdepth 1 -name '*.tgz' | wc -l)"
          echo "VENDOR_TARBALL_COUNT=$(find "$vendor" -maxdepth 1 -name '*.tgz' | wc -l)"

      - name: Verify packed install outside source workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deepseek-harness"
          cd "$root"
          pnpm exec tsx scripts/release/verify-packed-install.ts \
            --family dsh \
            --from "$RUNNER_TEMP/dsh-pack" \
            --from "$RUNNER_TEMP/vendor-pack"
